when:
  - event: [push, manual]
    branch: master

steps:
  - name: deploy
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/code/website-ahmad:/root/code/website-ahmad
    commands:
      - cp -a . /root/code/website-ahmad/
      - cd /root/code/website-ahmad
      - docker compose up -d --remove-orphans
